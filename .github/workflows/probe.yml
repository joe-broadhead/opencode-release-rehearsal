name: probe

# TEST ONLY (the release rehearsal): measures, with this run's token, a charts-sized createCommitOnBranch payload and
# an annotated v* tag made through REST under the `release tags` ruleset. See probe/probe.mjs. Not part of the kit.

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: probe the release workflow's GitHub calls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # a scratch branch, its commit and a probe tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: node probe/probe.mjs | tee "$RUNNER_TEMP/probe.json" && { echo '```json'; cat "$RUNNER_TEMP/probe.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
